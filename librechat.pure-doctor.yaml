version: 1.3.16
cache: true

interface:
  customWelcome: 'Super-Power Doctor AI — বাংলা বা English-এ আপনার স্বাস্থ্য প্রশ্ন লিখুন'
  customFooter: 'Super-Power Doctor AI · AI তথ্য সহায়ক, ডাক্তার নয় · স্বাস্থ্য বাতায়ন 16263'
  # Consent / Terms popup. Every user must accept it once before chatting;
  # acceptance (termsAccepted + termsAcceptedAt) is stored on each user record.
  # After changing this text, reset acceptance for every user so they see it:
  #   db.users.updateMany({}, {$set: {termsAccepted: false}, $unset: {termsAcceptedAt: ''}})
  # Text is not legal advice: have a lawyer check it against Bangladesh law.
  termsOfService:
    modalAcceptance: true
    modalTitle: 'শর্তাবলী ও সম্মতি / Terms and consent'
    modalContent: |
      ## বাংলা

      Super-Power Doctor AI ব্যবহারের আগে নিচের কথাগুলো পড়ুন।

      **এটা কী করে**
      - এটা একটি কৃত্রিম বুদ্ধিমত্তা (AI) স্বাস্থ্য-তথ্য সহায়ক। প্রতিটা প্রশ্নে এটা আগে WHO, NHS, DGHS, PubMed, ওষুধের label-এর মতো উৎস খুঁজে দেখে, তারপর সম্ভাব্য কারণ, এখনই কী করবেন, কোন বিপদচিহ্ন দেখবেন আর কোন পরীক্ষা লাগতে পারে, তা ধাপে ধাপে বলে, উৎসসহ।
      - ল্যাব রিপোর্ট বা প্রেসক্রিপশনের ছবি/PDF দিলে সেটা পড়ে বুঝিয়ে বলতে পারে।

      **এটা ডাক্তার নয়**
      - এটা রোগ নির্ণয় (diagnosis) করে না, আর আপনাকে দেখে বা পরীক্ষা করে না। এর উত্তর ভুল বা অসম্পূর্ণ হতে পারে।
      - এটা প্রেসক্রিপশন দেয় না, আর কারও জন্য ওষুধের ডোজ ঠিক বা বদল করে না। শুধু সরকারি/স্বীকৃত first aid নির্দেশনা যা বলে, অথবা ওষুধের label-এ যা লেখা, সেটা উৎসসহ জানায়।
      - চিকিৎসা শুরু, বন্ধ বা বদলানোর সিদ্ধান্ত একজন নিবন্ধিত ডাক্তারের সাথে কথা বলে নিন।

      **গুরুতর অবস্থায়**
      - এটা কোনো জরুরি সেবা নয়। এটা কাউকে খবর দেয় না, অ্যাম্বুলেন্স পাঠায় না, আর আপনার অবস্থার ওপর নজর রাখে না।
      - গুরুতর অবস্থায় এটা ধাপে ধাপে কী করতে হবে আর কখন হাসপাতালে যেতে হবে তা জানায়। কিন্তু চিকিৎসা নেওয়ার সিদ্ধান্ত আপনার, আর এখানে উত্তরের অপেক্ষায় চিকিৎসা নিতে দেরি করবেন না।
      - ফোনে স্বাস্থ্য পরামর্শ: স্বাস্থ্য বাতায়ন 16263। মানসিক সহায়তা: কান পেতে রই 09612-119911।

      **আপনার তথ্য**
      - উত্তর তৈরির জন্য আপনার লেখা ও আপলোড করা file বিদেশি তৃতীয় পক্ষের বিনামূল্যের (free) AI model-এ পাঠানো হয়। সেই প্রতিষ্ঠানগুলো আপনার মেসেজ সংরক্ষণ (log) করতে পারে এবং নিজেদের model উন্নত করতে ব্যবহার করতে পারে।
      - তাই নাম, ফোন নম্বর, ঠিকানা, NID বা অন্য পরিচয়ের তথ্য লিখবেন না। রিপোর্ট বা প্রেসক্রিপশন আপলোডের আগে সম্ভব হলে নাম ও ঠিকানা ঢেকে দিন।

      "I accept" চাপলে আপনি জানাচ্ছেন যে আপনি এগুলো পড়েছেন, বুঝেছেন এবং এই শর্তে সেবাটি ব্যবহার করতে সম্মত। আপনি কখন সম্মতি দিয়েছেন তা আপনার account-এ সংরক্ষিত থাকবে।

      ## English

      Please read this before you use Super-Power Doctor AI.

      **What it does**
      - It is an artificial intelligence (AI) health-information assistant. For every question it first checks sources such as WHO, NHS, DGHS, PubMed and drug labels, then explains step by step, with sources, the possible causes, what to do now, the danger signs to watch for and which tests may be needed.
      - It can read and explain a lab report or a prescription you upload as a photo or PDF.

      **It is not a doctor**
      - It does not diagnose, and it cannot see or examine you. Its answers can be wrong or incomplete.
      - It does not prescribe, and it does not set or change anyone's dose. It only tells you, with the source, what official or recognised first-aid guidance says or what a medicine's label says.
      - Talk to a registered doctor before starting, stopping or changing any treatment.

      **In a serious situation**
      - This is not an emergency service. It does not alert anyone, send an ambulance or monitor your condition.
      - In a serious situation it tells you step by step what to do and when to go to hospital, but the decision to get care is yours, and never delay care while waiting for an answer here.
      - Health advice by phone: Shasthyo Batayon 16263. Emotional support: Kaan Pete Roi 09612-119911.

      **Your information**
      - To produce answers, what you write and the files you upload are sent to free AI models run by third-party providers outside Bangladesh. Those providers may log your messages and may use them to train their models.
      - Do not enter your name, phone number, address, NID or other identifying details. Where you can, cover the name and address on a report or prescription before uploading it.

      By pressing "I accept" you confirm that you have read and understood this and agree to use the service on these terms. The time you accepted is recorded on your account.
  # UI only. Patients get the doctor agent and nothing to pick; the ADMIN role
  # turns the model selector, presets and parameters back on through a role
  # config override in the admin panel (Configuration > ADMIN).
  defaultPreset: false
  presets: false
  modelSelect: false
  parameters: false
  contextCost: false
  buildInfo: false
  # Feature permissions (agents, prompts, MCP servers, skills, marketplace,
  # web search, file search, memories, bookmarks, temporary chat, code runner,
  # shared links, schedules) are NOT set here on purpose. Anything set here is
  # rewritten into every role on each boot, which would lock the admin out too.
  # They are managed per role in the admin panel (Access > Roles):
  #   USER  - chat with the doctor agent, memories, web search, file upload
  #           and file search; no agent/prompt/MCP/skill building or sharing,
  #           no shared links, bookmarks, temporary chat or code runner.
  #   ADMIN - everything.
  # config/seed-role-policy.js applies the same policy to a fresh database.

modelSpecs:
  # Users can only chat through the doctor spec below; the API rejects any
  # other endpoint/model. The ADMIN role override sets this back to false.
  enforce: true
  prioritize: true
  list:
    - name: 'super-power-doctor-ai'
      label: '🩺 Super-Power Doctor AI'
      description: 'বাংলা ও English স্বাস্থ্য সহায়ক · উৎসসহ উত্তর · Health assistant with sourced answers'
      default: true
      preset:
        endpoint: 'agents'
        agent_id: 'agent_medical_research'
        modelLabel: '🩺 Super-Power Doctor AI'
        greeting: 'আসসালামু আলাইকুম! উপসর্গ, ওষুধ, ল্যাব রিপোর্ট বা প্রেসক্রিপশন নিয়ে বাংলা বা English-এ লিখুন। আমি WHO, NHS, DGHS আর PubMed-এর মতো উৎস দেখে ধাপে ধাপে উত্তর দেব।'

registration:
  socialLogins: []

# Off: private single-user app on free models. The `kilo/free-pool` alias has no
# price entry, so LibreChat billed it at the default rate (6 credits/token) and
# a ~25k-token agent prompt drained the 250k start balance in two messages.
balance:
  enabled: false
  startBalance: 250000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 100000

memory:
  disabled: false
  # `validKeys` is a GLOBAL key namespace, enforced before the per-person
  # partition is resolved (packages/api/src/agents/memory.ts). It therefore must
  # not contain per-person keys: `family_member_mother` / `family_member_father`
  # used to live here and defeated `memory_profiles`, because a model writing to
  # them without a `profile` argument pooled a relative's medical history into the
  # user's own record — the exact failure profiles exist to prevent — and there was
  # no key at all for a third relative. Each person now gets their own partition
  # and the same vocabulary inside it. Rows previously written under the removed
  # keys still load and are still injected (they are read, not rewritten); they
  # simply cannot be written again. See docs/MEMORY_AND_LONG_RUN.md.
  validKeys:
    - 'patient_profile'
    - 'allergies_and_adverse_reactions'
    - 'chronic_conditions'
    - 'active_medications'
    - 'lab_results'
    - 'clinical_preferences'
  tokenLimit: 12000
  personalize: true
  messageWindowSize: 8
  # LONG_RUN: this is a SECOND model dependency, separate from the chat model.
  # It is pinned to the same free-tier provider, so a provider outage silently
  # stops memory consolidation while chat keeps working — the agent quietly stops
  # learning with no user-visible error. Pin a paid model and add failover before
  # production; see docs/MEMORY_AND_LONG_RUN.md.
  agent:
    enabled: true
    provider: 'OpenRouter (Free)'
    model: 'kilo/free-pool'
    instructions: 'Extract structured clinical, medication, allergy, lab, and family member health context accurately.'

mcpServers:
  medical:
    type: stdio
    # Resolved through PATH: a hard-coded interpreter path only ever works on the
    # one machine it was written on, so the server could never start anywhere else
    # ("[MCP] Connection failed" at boot -> no medical tools at all).
    command: node
    args:
      # Repo-relative, and therefore resolved against the API process's working
      # directory. Always start the API from the repository root:
      #   host   npm run backend            (cwd = repo root)
      #   docker deploy-compose.yml sets   working_dir: /app
      # Starting it from `api/` (the upstream image default) resolves this to
      # /app/api/packages/... and the server never connects — 0 tools, silently.
      - packages/mcp-medical/dist/index.js
    # Inject the server's own standing instructions ("research first, judge
    # urgency yourself…", and "whenever a disease or symptom is mentioned, call
    # disease_knowledge_search with keywords and fetch every page") into the
    # model context. Unset means **no instructions at all**:
    # `resolveServerInstructions()` returns undefined unless this is set, so the
    # safety preamble in packages/mcp-medical/src/server.ts never reaches the
    # model. The tool-result notice still carries it, but the model would only
    # see that after it had already decided not to call the screen.
    serverInstructions: true
    timeout: 60000
    initTimeout: 30000
    chatMenu: false
    title: 'Medical Evidence Suite - 33 Live Tools'
    description: 'PubMed, Europe PMC, OpenFDA, RxNorm, DailyMed, LactMed, ChEMBL, Open Targets, ClinVar, ClinicalTrials.gov, MyGene.info, ICD-10-CM, WHO GHO, CMS NPI, BDDrugBank, CPIC, MedCalc'
    env:
      MEDICAL_CONTACT_EMAIL: 'medical-agent@example.org'
      # disease_knowledge_search: query embeddings + reranking come from the
      # self-hosted medtools service (compose service name `medtools`, port 8000
      # inside the network; 127.0.0.1:4134 from the host). Without these two the
      # tool still works, keyword-only. The key is read from the API's own env.
      MEDTOOLS_URL: 'http://medtools:8000'
      MEDTOOLS_API_KEY: '${MEDTOOLS_API_KEY}'
      # Uncomment to trim the catalogue for a small model (the emergency screen
      # cannot be removed by either variable):
      # MEDICAL_TOOL_GROUPS: 'formulary,drugs,calculators,emergency'

endpoints:
  agents:
    disableBuilder: false
    recursionLimit: 50
    maxRecursionLimit: 100
    capabilities:
      - 'deferred_tools'
      - 'file_search'
      - 'subagents'
      - 'context'
      - 'memory'
      - 'tools'
      - 'chain'
      - 'ocr'
      - 'conversation_history'
      - 'web_search'
  custom:
    # The chat model endpoint. It must be an OpenAI-compatible server that serves
    # the model ids below; nothing in this repository provides one, so a fresh
    # deployment does not answer until this is pointed at a real endpoint.
    #
    #  - host run:        MEDICAL_LLM_BASE_URL=http://127.0.0.1:4120/v1
    #  - docker:          deploy-compose.yml defaults it to
    #                     http://host.docker.internal:4120/v1 (inside a container
    #                     127.0.0.1 is the container itself)
    #  - hosted provider: set it to the provider's /v1 URL and put its key in
    #                     MEDICAL_LLM_API_KEY, then set `model.id` in
    #                     packages/mcp-medical/agent/agent.json to a model that
    #                     provider actually serves, and re-run the seed.
    #
    # `node config/verify-deployment.js` checks that this endpoint answers before
    # it declares the deployment ready.
    - name: 'OpenRouter (Free)'
      apiKey: '${MEDICAL_LLM_API_KEY}'
      baseURL: '${MEDICAL_LLM_BASE_URL}'
      # No predefined context size here: each model's real window is read from
      # provider metadata (MODEL_CONTEXT_FILE, written daily from the providers'
      # live model lists by ~/kilo-router/model_context.py). `kilo/free-pool` is
      # the Bifrost routing alias over every passing Kilo free model.
      models:
        default:
          - 'kilo/free-pool'
          - 'medical-copilot-pro'
        # Off: Bifrost lists only real provider models, not the `kilo/free-pool`
        # routing alias, and LibreChat rejects an agent model missing from the list.
        fetch: false
      titleConvo: true
      titleModel: 'kilo/free-pool'
      modelDisplayLabel: 'Super-Power Doctor AI Engine'

# --- Free, self-hosted web search, OCR and voice (added 2026-10-28) ---------------
# Search: SearXNG container (http://searxng:8080). Scraper: medtools exposes a
# Firecrawl-compatible /v1/scrape (httpx + trafilatura, PDF text, keyless Jina
# Reader fallback). Reranker: medtools exposes a Jina-compatible /v1/rerank backed
# by a local multilingual cross-encoder. No paid keys; the "keys" are the shared
# internal MEDTOOLS_API_KEY.
webSearch:
  searchProvider: 'searxng'
  scraperProvider: 'firecrawl'
  rerankerType: 'jina'
  searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
  searxngApiKey: '${SEARXNG_API_KEY}'
  firecrawlApiKey: '${FIRECRAWL_API_KEY}'
  firecrawlApiUrl: '${FIRECRAWL_API_URL}'
  firecrawlVersion: '${FIRECRAWL_VERSION}'
  jinaApiKey: '${JINA_API_KEY}'
  jinaApiUrl: '${JINA_API_URL}'
  safeSearch: 1
  scraperTimeout: 15000
  allowedAddresses:
    - 'searxng:8080'
    - 'medtools:8000'

# OCR: medtools exposes a Mistral-OCR-compatible API backed by Tesseract
# (Bengali + English) and poppler, for images and scanned PDFs.
ocr:
  strategy: 'mistral_ocr'
  apiKey: '${OCR_API_KEY}'
  baseURL: '${OCR_BASEURL}'
  mistralModel: 'mistral-ocr-latest'
  allowedAddresses:
    - 'medtools:8000'

# Images uploaded in chat go through the OCR above (Tesseract, Bengali + English)
# and reach the agent as text. Sending them to the free model as pictures made it
# misread prescriptions (wrong name, age and days), and most free models have no vision.
fileConfig:
  endpoints:
    agents:
      defaultLLMDeliveryPath:
        overrides:
          'image/*': 'text'
          # PDFs too: text extraction (OCR for scans) instead of the raw file, which
          # text-only models in the free pool reject ("does not support file input").
          'application/pdf': 'text'

# Voice: the browser's own speech engines (free, no server). Defaults to Bengali
# (Bangladesh); each user can switch the language under Settings > Speech.
speech:
  speechTab:
    conversationMode: false
    advancedMode: false
    speechToText:
      engineSTT: 'browser'
      languageSTT: 'bn-BD'
      autoTranscribeAudio: true
      decibelValue: -45
      autoSendText: -1
    textToSpeech:
      engineTTS: 'browser'
      languageTTS: 'bn-BD'
      automaticPlayback: false
      playbackRate: 1.0
      cacheTTS: false
