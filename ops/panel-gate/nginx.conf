worker_processes 2;
pid /tmp/panel-gate-nginx.pid;
error_log /home/sprite/panel-gate/nginx-error.log warn;
daemon off;

events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    absolute_redirect off;
    client_body_temp_path /tmp/panel-gate-body;
    proxy_temp_path /tmp/panel-gate-proxy;
    fastcgi_temp_path /tmp/panel-gate-fcgi;
    uwsgi_temp_path /tmp/panel-gate-uwsgi;
    scgi_temp_path /tmp/panel-gate-scgi;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # User panel (LibreChat web app) - Cloudflare quick tunnel (fallback)
    server {
        listen 127.0.0.1:9080;
        client_max_body_size 50m;
        set $gate_title "Medical Agent";
        set $client_ip $http_cf_connecting_ip;
        include /home/sprite/panel-gate/gate-common.conf;
        location / {
            auth_request /__gate_check;
            error_page 401 = @gate_login;
            proxy_pass http://127.0.0.1:8080;
            include /home/sprite/panel-gate/proxy-common.conf;
        }
    }

    # Admin panel - Cloudflare quick tunnel (fallback)
    server {
        listen 127.0.0.1:9300;
        client_max_body_size 50m;
        set $gate_title "Medical Agent Admin";
        set $client_ip $http_cf_connecting_ip;
        include /home/sprite/panel-gate/gate-common.conf;
        location / {
            auth_request /__gate_check;
            error_page 401 = @gate_login;
            proxy_pass http://127.0.0.1:3000;
            include /home/sprite/panel-gate/proxy-common.conf;
        }
    }

    # Stable links via Tailscale Funnel. tailscaled (on 127.0.0.1) appends the
    # real visitor IP to X-Forwarded-For; realip takes the last entry it added.
    server {
        listen 127.0.0.1:9081;
        client_max_body_size 50m;
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header X-Forwarded-For;
        set $gate_title "Medical Agent";
        set $client_ip $remote_addr;
        include /home/sprite/panel-gate/gate-common.conf;
        location / {
            auth_request /__gate_check;
            error_page 401 = @gate_login;
            proxy_pass http://127.0.0.1:8080;
            include /home/sprite/panel-gate/proxy-common.conf;
        }
    }

    server {
        listen 127.0.0.1:9301;
        client_max_body_size 50m;
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header X-Forwarded-For;
        set $gate_title "Medical Agent Admin";
        set $client_ip $remote_addr;
        include /home/sprite/panel-gate/gate-common.conf;
        location / {
            auth_request /__gate_check;
            error_page 401 = @gate_login;
            proxy_pass http://127.0.0.1:3000;
            include /home/sprite/panel-gate/proxy-common.conf;
        }
    }
}
