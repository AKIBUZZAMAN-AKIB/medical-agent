# Docker Compose for *this* deployment (the medical fork).
#
# Differences from the upstream `docker-compose.yml` matter, so they are listed
# here rather than left to be discovered at 3am:
#
#  1. `api` is **built from this repository** (`Dockerfile.multi`, target
#     `api-build`). The published upstream image does not contain
#     `packages/mcp-medical/dist`, `packages/mcp-medical/data`,
#     `packages/mcp-medical/agent` or `config/seed-medical-agent.js`, so an
#     upstream image runs this stack *without any medical tools at all*.
#  2. The config file is mounted from the file that actually exists in the repo
#     (`librechat.pure-doctor.yaml`). The upstream compose mounts `./librechat.yaml`,
#     which is gitignored and absent in a fresh clone; Docker then creates an empty
#     *directory* at that path, the YAML load fails, and LibreChat silently starts
#     with **no custom config** — no agent endpoint, no memory settings, no MCP
#     server.
#  3. The API runs with `working_dir: /app` and `node api/server/index.js`. The
#     medical MCP server is launched with the repo-relative path
#     `packages/mcp-medical/dist/index.js`, which is resolved against the process
#     working directory. The image default (`/app/api`) resolves it to
#     `/app/api/packages/...` → "Connection failed" → **0 tools**. This was
#     reproduced: `Cannot find module '/app/api/packages/mcp-medical/dist/index.js'`.
#  4. `SCHEDULES_SINGLE_PROCESS=true` is set because this stack runs exactly one
#     API replica and no Redis. Without it the scheduler refuses to arm and logs
#     an error at every boot.
#  5. `LIBRECHAT_LOG_DIR` is pinned to the mounted volume so logs survive a
#     restart regardless of the working directory.
#
# Bring-up order:   docker compose -f deploy-compose.yml up -d --build
# Seed the agent:   docker compose -f deploy-compose.yml --profile seed run --rm seed
#                   (after creating an ADMIN user with config/create-user.js)
# See docs/DEPLOYMENT.md and `node config/verify-deployment.js`.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: api-build
    # `build` is what puts the medical package, the BD corpus, the fork config and
    # the seed script into the image. Deleting this block silently deploys upstream
    # LibreChat with zero medical tools.
    image: medical-agent-api:local
    container_name: LibreChat-API
    ports:
      - '${PORT:-3080}:3080'
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Must match the file bind-mounted below, not `./librechat.yaml`.
      - CONFIG_PATH=/app/librechat.yaml
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_LOG_DIR=/app/api/logs
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      # One API replica, no Redis: assert it so the scheduler arms.
      - SCHEDULES_SINGLE_PROCESS=${SCHEDULES_SINGLE_PROCESS:-true}
      # The chat model endpoint. Inside a container `127.0.0.1` is the container
      # itself, so an engine on the Docker host must be reached through
      # host.docker.internal. Point this at any OpenAI-compatible endpoint.
      - MEDICAL_LLM_BASE_URL=${MEDICAL_LLM_BASE_URL:-http://host.docker.internal:4120/v1}
      - MEDICAL_LLM_API_KEY=${MEDICAL_LLM_API_KEY:-local-medical-engine-key}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
    # Repo-relative MCP entry path only resolves when the process starts from the
    # repository root; this is what makes it work inside the image.
    working_dir: /app
    command: ['node', 'api/server/index.js']
    volumes:
      # Baked into the image AND mounted here, so an edit to the file takes effect
      # on `docker compose restart api` without a rebuild.
      - type: bind
        source: ./librechat.pure-doctor.yaml
        target: /app/librechat.yaml
        read_only: true
      - ./client/public/images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./skill:/app/skill
      - librechat-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3080/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # One-shot: creates/updates the doctor agent + specialist sub-agents and grants
  # them to `--share-with-role`. Without this the app has no agent to chat with.
  #   docker compose -f deploy-compose.yml --profile seed run --rm seed
  #   docker compose -f deploy-compose.yml --profile seed run --rm seed \
  #     node config/seed-medical-agent.js --dry-run
  # The seed requires an ADMIN user to own the agents, so create one first.
  seed:
    profiles: ['seed']
    image: medical-agent-api:local
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/librechat.yaml
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
    working_dir: /app
    command: ['node', 'config/seed-medical-agent.js', '--share-with-role=USER']
    volumes:
      - type: bind
        source: ./librechat.pure-doctor.yaml
        target: /app/librechat.yaml
        read_only: true

  # Optional separate admin console image. This fork's own admin portal is a page
  # inside the client at /admin and needs nothing here; enable this profile only
  # if you also want the standalone panel on the admin.<host> subdomain.
  # Requires ADMIN_PANEL_SESSION_SECRET (>= 32 chars) in .env.
  admin-panel:
    profiles: ['admin-panel']
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    container_name: admin-panel
    depends_on:
      api:
        condition: service_healthy
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:3080
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
      # Bearer token for the Prometheus /metrics endpoint; unset means /metrics answers 401.
      - ADMIN_PANEL_METRICS_SECRET=${ADMIN_PANEL_METRICS_SECRET:-}

  client:
    image: nginx:1.27.0-alpine
    container_name: LibreChat-NGINX
    # 443 is deliberately not published: client/nginx.conf has no TLS listener by
    # default. Terminate TLS in front of this container (or uncomment the SSL
    # block in nginx.conf and mount certificates) before exposing it publicly.
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mongodb:
    container_name: chat-mongodb
    # ports:  # Uncomment this to access mongodb from outside docker, not safe in deployment
    #   - 27018:27017
    image: mongo:8.0.20
    restart: always
    # No `--auth`: the port is not published, so only the compose network reaches
    # it. Add `--auth` plus MONGO_URI credentials before exposing MongoDB at all.
    command: mongod --noauth
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    # ports: # Uncomment this to access meilisearch from outside docker
    #   - 7700:7700
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      # `production` (Meilisearch's default) refuses to start without a master key
      # of at least 16 bytes. Keep development mode on a private network, or set
      # MEILI_MASTER_KEY in .env and MEILI_ENV=production together with SEARCH=true.
      - MEILI_ENV=${MEILI_ENV:-development}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7700/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
      # Taken from the same variables as vectordb so the two cannot drift apart.
      - POSTGRES_DB=${POSTGRES_DB:-mydatabase}
      - POSTGRES_USER=${POSTGRES_USER:-myuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mypassword}
    restart: always
    depends_on:
      vectordb:
        condition: service_healthy
    env_file:
      - .env

volumes:
  pgdata2:
  librechat-data:
  mongodb-data:
  meili-data:
